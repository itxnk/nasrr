<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NASRR • Street Rush</title>
<style>
:root{--neon:#00e5ff;--pink:#ff2d75;--panel:rgba(7,12,24,.82);--text:#f8fbff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03050b;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;overflow-x:hidden}
body{display:flex;justify-content:center}.wrap{width:min(1100px,100%);padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.logo{font-weight:900;letter-spacing:2px;font-size:clamp(20px,4vw,30px)}.logo span{color:var(--neon)}
.top{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:var(--panel);border:1px solid #26344c;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}
#gamebox{position:relative;width:100%;aspect-ratio:16/9;min-height:420px;max-height:720px;border:1px solid #26344c;border-radius:20px;overflow:hidden;background:#08101c;box-shadow:0 20px 70px rgba(0,0,0,.55)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}.hudtop{display:flex;justify-content:space-between;padding:18px;gap:8px}.stat{background:rgba(3,7,15,.62);backdrop-filter:blur(8px);border:1px solid #34445d;border-radius:12px;padding:8px 12px;min-width:82px}.stat b{display:block;font-size:17px}.stat small{opacity:.65;font-size:10px;text-transform:uppercase;letter-spacing:1px}
.nitro{position:absolute;left:18px;top:85px;width:145px;height:9px;border-radius:9px;background:#182338;border:1px solid #31415a;overflow:hidden}.nitro i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#00b7ff,#8cf7ff);transform-origin:left}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,5,12,.58);backdrop-filter:blur(5px);pointer-events:auto}.card{width:min(520px,92%);padding:28px;border:1px solid #31415a;background:rgba(7,12,24,.94);border-radius:22px;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.6)}h1{font-size:clamp(34px,7vw,66px);margin:0 0 6px;letter-spacing:-2px}h1 span{color:var(--neon)}.sub{opacity:.72;margin:0 0 22px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:1px solid #3a4b68;background:#111c30;color:white;border-radius:12px;padding:13px 16px;font-weight:900;font-size:14px;cursor:pointer}.btn:hover{border-color:#657b9f;transform:translateY(-1px)}.primary{background:linear-gradient(135deg,#00b7ff,#0078ff);border:0;color:#00101a}.danger{background:#341525;border-color:#70304d}.tiny{font-size:11px;opacity:.55;margin-top:16px}
.controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.steer{display:flex;gap:10px}.ctrl{pointer-events:auto;width:62px;height:62px;border-radius:18px;border:1px solid #63738d;background:rgba(8,14,26,.72);color:white;font-size:27px;font-weight:900;touch-action:none}.boost{pointer-events:auto;width:88px;height:62px;border-radius:18px;border:1px solid #00b7ff;background:rgba(0,120,180,.35);color:#aaf4ff;font-weight:1000;letter-spacing:1px;touch-action:none}
.pause{position:absolute;right:18px;top:86px;pointer-events:auto;width:42px;height:42px;border-radius:12px;border:1px solid #44546d;background:rgba(3,7,15,.7);color:white;font-weight:900}
.hidden{display:none!important}
footer{display:flex;justify-content:space-between;gap:12px;margin-top:10px;opacity:.55;font-size:11px;padding:0 4px}
@media(max-width:650px){.wrap{padding:7px}header{margin-bottom:7px}.top .pill:nth-child(n+3){display:none}#gamebox{aspect-ratio:9/14;min-height:0;border-radius:16px}.hudtop{padding:10px}.stat{padding:6px 8px;min-width:65px}.stat b{font-size:14px}.nitro{left:10px;top:67px;width:115px}.pause{top:66px;right:10px}.controls{bottom:10px;left:10px;right:10px}.ctrl,.boost{height:56px}.card{padding:22px}.buttons{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">NASRR <span>STREET RUSH</span></div><div class="top"><div class="pill">🏁 ENDLESS</div><div class="pill">⚡ NITRO</div><div class="pill">📱 MOBILE + PC</div></div></header>
<div id="gamebox">
<canvas id="game" aria-label="Nasrr Street Rush racing game"></canvas>
<div class="hud">
<div class="hudtop">
<div class="stat"><small>Score</small><b id="score">0</b></div>
<div class="stat"><small>Speed</small><b id="speed">0 km/h</b></div>
<div class="stat"><small>Best</small><b id="best">0</b></div>
<div class="stat"><small>Coins</small><b id="coins">0</b></div>
</div>
<div class="nitro"><i id="nitro"></i></div>
<button class="pause" id="pause" aria-label="Pause">Ⅱ</button>
<div class="controls">
<div class="steer"><button class="ctrl" id="left">‹</button><button class="ctrl" id="right">›</button></div>
<button class="boost" id="boost">NITRO ⚡</button>
</div>
<div class="screen" id="menu"><div class="card"><h1>NASRR <span>RUSH</span></h1><p class="sub">Dodge traffic. Collect coins. Burn the highway.</p><div class="buttons"><button class="btn primary" id="start">START RACE</button><button class="btn" id="how">HOW TO PLAY</button></div><p class="tiny">Arrow keys / A D to steer • Space for nitro • P to pause</p></div></div>
<div class="screen hidden" id="over"><div class="card"><h1>RACE <span>OVER</span></h1><p class="sub" id="result">Score 0</p><div class="buttons"><button class="btn primary" id="again">RACE AGAIN</button><button class="btn" id="home">MAIN MENU</button></div></div></div>
</div>
</div>
<footer><span>NASRR • Street Rush</span><span>Best score is saved on this device</span></footer>
</div>
<script>
(() => {
const c=document.getElementById('game'),x=c.getContext('2d');let W=900,H=506,dpr=1,raf=0,last=0;
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let state='menu',score=0,coins=0,best=Number(localStorage.getItem('nasrrBest')||0),nitro=100,dist=0,speed=0,time=0,shake=0;
let player={lane:1,z:0},traffic=[],particles=[],keys={left:false,right:false,boost:false},spawn=0,coinSpawn=0;
$('best').textContent=best;
function resize(){const r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=Math.max(320,r.width);H=Math.max(420,r.height);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function reset(){score=0;coins=0;nitro=100;dist=0;speed=0;time=0;shake=0;traffic=[];particles=[];player.lane=1;spawn=.5;coinSpawn=1;keys.left=keys.right=keys.boost=false}
function start(){reset();state='play';$('menu').classList.add('hidden');$('over').classList.add('hidden')}
function end(){state='over';best=Math.max(best,score);localStorage.setItem('nasrrBest',best);$('best').textContent=best;$('result').textContent='Score '+score+' • Coins '+coins+' • Distance '+Math.floor(dist)+' m';}
$('start').onclick=start;$('again').onclick=start;$('home').onclick=()=>{state='menu';$('over').classList.add('hidden');$('menu').classList.remove('hidden')};
$('how').onclick=()=>alert('Steer with ← → or A/D. Hold NITRO or press Space for a speed burst. Dodge traffic, collect coins and survive as long as possible.');
$('pause').onclick=()=>{if(state==='play')state='pause';else if(state==='pause')state='play'};
function key(e,on){if(['ArrowLeft','a','A'].includes(e.key))keys.left=on;if(['ArrowRight','d','D'].includes(e.key))keys.right=on;if(e.key===' '||e.key==='Shift')keys.boost=on;if(e.key==='p'||e.key==='P')$('pause').click();if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()}
addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
function bind(id,k){const b=$(id);const on=e=>{e.preventDefault();keys[k]=true};const off=e=>{e.preventDefault();keys[k]=false};['pointerdown'].forEach(v=>b.addEventListener(v,on));['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,off))}
bind('left','left');bind('right','right');bind('boost','boost');
function road(){const horizon=H*.30,bot=H+30,roadTop=W*.27,roadBot=W*.94;let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#132d48');g.addColorStop(.42,'#0d2030');g.addColorStop(1,'#071018');x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='#173a22';x.fillRect(0,horizon,W,H-horizon);x.fillStyle='#071018';
poly(roadTop,horizon,W-roadTop,horizon,roadBot,bot,W-roadBot,bot);x.fillStyle='#252b34';poly(roadTop,horizon,W-roadTop,horizon,roadBot,bot,W-roadBot,bot);
for(let i=0;i<8;i++){let p=((i/8+time*.0018)%1),y=horizon+(bot-horizon)*p*p,w=4+(W*.018)*p;let cx=W/2; x.fillStyle='#dfe8ef';x.fillRect(cx-w/2,y,w,Math.max(4,18*p))}
for(let side of [-1,1]){for(let i=0;i<10;i++){let p=((i/10+time*.0008)%1),y=horizon+(bot-horizon)*p*p;let edge=W/2+side*(roadTop/2+(roadBot-roadTop)/2*p*p);let s=5+16*p;x.fillStyle=i%2?'#f7f7f7':'#ff3b30';x.fillRect(edge-side*s/2,y,s,Math.max(4,15*p))}}
}
function poly(...a){x.beginPath();x.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)x.lineTo(a[i],a[i+1]);x.closePath();x.fill()}
function roadX(lane,p){let top=W*.27,bot=W*.94;let width=top+(bot-top)*p*p;return W/2+(lane-1)*width*.29}
function car(px,py,s,color,playerCar=false){x.save();x.translate(px,py);x.scale(s,s);x.shadowBlur=playerCar?18:8;x.shadowColor=color;x.fillStyle=color;round(-23,-42,46,84,10);x.fillStyle='#10151d';round(-17,-25,34,29,7);x.fillStyle='#8eeaff';round(-14,-21,28,17,5);x.fillStyle='#161b22';round(-18,24,9,20,3);round(9,24,9,20,3);x.fillStyle='#fff';round(-18,-39,10,7,3);round(8,-39,10,7,3);x.fillStyle='#ff3030';round(-18,32,10,7,2);round(8,32,10,7,2);x.restore()}
function round(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function spawnTraffic(){let lane=Math.floor(Math.random()*3),color=['#ff315c','#ffc400','#8b5cf6','#21d17a','#f97316'][Math.floor(Math.random()*5)];if(!traffic.some(t=>t.lane===lane&&t.p<.18))traffic.push({lane,p:0,color,speed:.68+Math.random()*.35});}
function spawnCoin(){let lane=Math.floor(Math.random()*3);traffic.push({lane,p:.08,color:'#ffd84a',coin:true,speed:.3});}
function particle(px,py,n=4){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*4,vy:Math.random()*3+1,a:1,s:2+Math.random()*4})}
function update(dt){time+=dt*1000;let boost=keys.boost&&nitro>0;speed+=(boost?920:650-speed)*dt*.8;speed=clamp(speed,260,boost?920:650);if(boost)nitro=clamp(nitro-dt*28,0,100);else nitro=clamp(nitro+dt*7,0,100);dist+=speed*dt*.028;score=Math.floor(dist*.7)+coins*50;
if(keys.left)player.lane-=dt*3;if(keys.right)player.lane+=dt*3;player.lane=clamp(player.lane,0,2);
spawn-=dt;if(spawn<=0){spawnTraffic();spawn=Math.max(.38,1.05-speed/1500)}
coinSpawn-=dt;if(coinSpawn<=0){spawnCoin();coinSpawn=1.5+Math.random()*2}
for(let i=traffic.length-1;i>=0;i--){let t=traffic[i];t.p+=dt*(speed/650)*t.speed;if(t.p>1.05){traffic.splice(i,1);continue}let px=roadX(t.lane,t.p),py=H*.30+(H*.72)*t.p*t.p,sc=.25+.95*t.p;if(t.coin&&t.p>.72&&t.p<.98&&Math.abs(player.lane-t.lane)<.28){coins++;particle(px,py,12);traffic.splice(i,1);continue}if(!t.coin&&t.p>.78&&Math.abs(player.lane-t.lane)<.31){particle(W/2+(player.lane-1)*W*.22,H*.82,35);shake=18;end();return}}
if(boost)particle(W/2+(player.lane-1)*W*.2,H*.88,2);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.a-=dt*2;if(p.a<=0)particles.splice(i,1)}shake*=.9;
$('score').textContent=score;$('coins').textContent=coins;$('speed').textContent=Math.floor(speed/1.609)+' km/h';$('nitro').style.width=nitro+'%'}
function draw(){x.save();if(shake>x){}if(shake>1)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);road();for(const t of traffic){let px=roadX(t.lane,t.p),py=H*.30+(H*.72)*t.p*t.p;if(t.coin){x.save();x.translate(px,py);x.scale(.4+.9*t.p,.4+.9*t.p);x.rotate(time*.003);x.fillStyle='#ffd84a';x.strokeStyle='#fff2a8';x.lineWidth=3;x.beginPath();x.arc(0,0,18,0,7);x.fill();x.stroke();x.restore()}else car(px,py,.25+.95*t.p,t.color)}car(W/2+(player.lane-1)*W*.21,H*.82,1,'#00d9ff',true);for(const p of particles){x.globalAlpha=p.a;x.fillStyle='#9cefff';x.fillRect(p.x,p.y,p.s,p.s*2)}x.globalAlpha=1;x.restore();if(state==='pause'){x.fillStyle='rgba(0,0,0,.4)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='900 42px system-ui';x.fillText('PAUSED',W/2,H/2);x.font='600 15px system-ui';x.fillText('Press P or tap Ⅱ to continue',W/2,H/2+30)}}
function loop(ts){let dt=Math.min(.035,(ts-last)/1000||0);last=ts;if(state==='play')update(dt);draw();raf=requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
